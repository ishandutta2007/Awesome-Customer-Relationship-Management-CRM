<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Glow & Shadow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-10px) scale(1.02); }
      }
      @keyframes floatRev {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes pulseBeam {
        0%, 100% { stroke-dashoffset: 0; opacity: 0.3; }
        50% { stroke-dashoffset: 40; opacity: 0.8; }
      }
      @keyframes orbGlow {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(1.15); }
      }
      @keyframes pipelineSweep {
        0% { transform: scaleX(0.2); }
        50% { transform: scaleX(0.9); }
        100% { transform: scaleX(0.2); }
      }
      
      .bg-grid { opacity: 0.12; }
      .anim-float1 { animation: floatSlow 7s ease-in-out infinite; }
      .anim-float2 { animation: floatRev 6s ease-in-out infinite; }
      .anim-beam { stroke-dasharray: 8 12; animation: pulseBeam 4s linear infinite; }
      .anim-orb { animation: orbGlow 8s ease-in-out infinite; transform-origin: center; }
      .bar-progress { transform-origin: left; animation: pipelineSweep 5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Orbs -->
  <circle cx="180" cy="100" r="140" fill="#6366f1" class="anim-orb" filter="url(#neonGlow)" />
  <circle cx="1020" cy="240" r="130" fill="#38bdf8" class="anim-orb" filter="url(#neonGlow)" />
  <circle cx="900" cy="80" r="100" fill="#a855f7" class="anim-orb" filter="url(#neonGlow)" />

  <!-- Tech Geometric Grid -->
  <g class="bg-grid">
    <path d="M 0,60 H 1200 M 0,120 H 1200 M 0,180 H 1200 M 0,240 H 1200 M 0,300 H 1200" stroke="#94a3b8" stroke-width="0.75" />
    <path d="M 120,0 V 360 M 240,0 V 360 M 360,0 V 360 M 480,0 V 360 M 600,0 V 360 M 720,0 V 360 M 840,0 V 360 M 960,0 V 360 M 1080,0 V 360" stroke="#94a3b8" stroke-width="0.75" />
  </g>

  <!-- Dynamic Background Connectors / Data Flow Lines -->
  <g class="anim-beam" fill="none">
    <path d="M 150,290 C 350,330 650,290 850,310" stroke="#38bdf8" stroke-width="2" />
    <path d="M 750,50 C 900,30 1000,120 1120,100" stroke="#818cf8" stroke-width="1.8" />
  </g>

  <!-- Dynamic CRM Stage / Metrics Card 1 (Right Top) -->
  <g class="anim-float1" transform="translate(820, 45)" filter="url(#cardShadow)">
    <rect width="320" height="115" rx="12" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
    <!-- Mini Pipeline Graphic -->
    <circle cx="28" cy="28" r="10" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" />
    <path d="M 24,28 L 27,31 L 32,25" fill="none" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" />
    <text x="48" y="32" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Sales Pipeline Velocity</text>
    <text x="260" y="32" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">+38% YoY</text>
    <!-- Progress Bar -->
    <rect x="25" y="55" width="270" height="7" rx="3.5" fill="#334155" />
    <rect x="25" y="55" width="220" height="7" rx="3.5" fill="url(#primaryGrad)" class="bar-progress" />
    <!-- Metric Chips -->
    <rect x="25" y="78" width="75" height="22" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
    <text x="35" y="93" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Leads: 4.8k</text>
    <rect x="110" y="78" width="85" height="22" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
    <text x="120" y="93" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Deals: $2.4M</text>
    <rect x="205" y="78" width="90" height="22" rx="6" fill="#1e293b" stroke="#475569" stroke-width="0.8" />
    <text x="215" y="93" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Win Rate: 68%</text>
  </g>

  <!-- Dynamic CRM Stage / Metrics Card 2 (Right Bottom) -->
  <g class="anim-float2" transform="translate(850, 185)" filter="url(#cardShadow)">
    <rect width="290" height="110" rx="12" fill="url(#cardGrad1)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="28" cy="28" r="10" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="28" cy="28" r="4" fill="#818cf8" />
    <text x="48" y="32" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Open-Source &amp; SaaS</text>
    <text x="28" y="65" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Self-Hosted • Cloud • RevOps</text>
    
    <!-- Badges inside card -->
    <rect x="28" y="76" width="60" height="20" rx="4" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="0.8" />
    <text x="36" y="90" fill="#60a5fa" font-family="sans-serif" font-size="10" font-weight="600">Twenty</text>
    <rect x="96" y="76" width="55" height="20" rx="4" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="0.8" />
    <text x="105" y="90" fill="#c084fc" font-family="sans-serif" font-size="10" font-weight="600">Odoo</text>
    <rect x="159" y="76" width="55" height="20" rx="4" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="0.8" />
    <text x="166" y="90" fill="#22d3ee" font-family="sans-serif" font-size="10" font-weight="600">ERPNext</text>
    <rect x="222" y="76" width="52" height="20" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="0.8" />
    <text x="229" y="90" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="600">Monica</text>
  </g>

  <!-- Foreground Title and Branding Content -->
  <!-- Category Pill Badge -->
  <g transform="translate(60, 48)">
    <rect width="250" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="16" cy="15" r="5" fill="#38bdf8" />
    <text x="30" y="20" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">AWESOME CRM ECOSYSTEM</text>
  </g>

  <!-- Main Headline Title -->
  <g transform="translate(60, 130)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="44" letter-spacing="-0.5">
      <tspan fill="#f8fafc">Customer Relationship</tspan>
      <tspan x="0" y="52" fill="url(#primaryGrad)">Management (CRM)</tspan>
    </text>
  </g>

  <!-- Subtitle Description -->
  <g transform="translate(60, 230)">
    <text fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      <tspan x="0" y="0">Curated directory of top-tier SaaS platforms &amp; high-performance open-source repos.</tspan>
      <tspan x="0" y="24">Empowering Sales Pipelines, RevOps, Customer Success &amp; Self-Hosted Deployments.</tspan>
    </text>
  </g>

  <!-- Feature Pills Footer -->
  <g transform="translate(60, 290)">
    <rect x="0" y="0" width="135" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="14" y="18" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="500">⚡ Sales Automation</text>

    <rect x="145" y="0" width="135" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="158" y="18" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="500">🏢 SaaS Benchmarks</text>

    <rect x="290" y="0" width="140" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="303" y="18" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="500">🔓 Self-Hosted FOSS</text>

    <rect x="440" y="0" width="140" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="453" y="18" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="500">🤖 AI Lead Scoring</text>
  </g>
</svg>
